{% load static %}
<!-- ===================== UNIFIED STUDENT SIDEBAR ===================== -->
<aside class="sidebar" id="sidebar">
    <!-- Brand Header -->
    <div class="sidebar-brand">
        <div class="brand-logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="10" width="4" height="11" rx="1.5" fill="#38bdf8"/>
                <rect x="9" y="5" width="4" height="16" rx="1.5" fill="#2563eb"/>
                <rect x="16" y="2" width="4" height="19" rx="1.5" fill="#60a5fa"/>
            </svg>
        </div>
        <div class="brand-title-wrap">
            <h2 class="brand-title" style="color: #2563eb; font-size: 1.05rem;">Placement Readiness</h2>
            <span class="brand-sub">Scorecard</span>
        </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-menu">
        <!-- 1. Dashboard -->
        <a href="{% url 'student:dashboard' %}" class="nav-item {% if active_nav == 'dashboard' %}active{% endif %}">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Dashboard</span>
        </a>

        <!-- 2. My Portfolio -->
        <a href="{% url 'myportfolio:preview' %}" class="nav-item {% if active_nav == 'portfolio' or active_nav == 'profile' %}active{% endif %}">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>My Portfolio</span>
        </a>

        <!-- 3. Assignments Dropdown -->
        <div class="sidebar-dropdown-group" id="assignmentsGroup">
            <div class="nav-item nav-item-dropdown {% if active_nav == 'assignments' %}active{% endif %}" id="assignmentsToggle" role="button" tabindex="0">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                <span style="flex: 1;">Assignments</span>
                <svg class="dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>

            <!-- Up-Down Vertical Submenu (Hidden until clicked) -->
            <div class="sidebar-submenu" id="assignmentsSubmenu" style="display: none; flex-direction: column; width: 100%; padding: 4px 8px 6px 36px; gap: 4px;">
                <a href="{% url 'assignments:student_list' %}" class="submenu-item {% if active_sub == 'available' %}active{% endif %}" style="display: flex; flex-direction: row; align-items: center; width: 100%;">
                    <span class="submenu-bullet"></span>
                    <span>Available Tests</span>
                </a>
                <a href="{% url 'assignments:student_results_list' %}" class="submenu-item {% if active_sub == 'results' %}active{% endif %}" style="display: flex; flex-direction: row; align-items: center; width: 100%;">
                    <span class="submenu-bullet"></span>
                    <span>My Results</span>
                </a>
            </div>
        </div>

        <!-- 4. Readiness Score -->
        <a href="{% url 'student:readiness' %}" class="nav-item {% if active_nav == 'readiness' %}active{% endif %}">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="6"></circle>
                <circle cx="12" cy="12" r="2"></circle>
            </svg>
            <span>Readiness Score</span>
        </a>

        <!-- 5. Leaderboard -->
        <a href="{% url 'student:rankings' %}" class="nav-item {% if active_nav == 'rankings' %}active{% endif %}">
            <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
            </svg>
            <span>Leaderboard</span>
        </a>
    </nav>

    <!-- Sidebar Footer with User Profile Pill & Logout -->
    <div class="sidebar-footer" style="padding: 16px; border-top: 1px solid var(--clr-border);">
        <a href="{% url 'myportfolio:editor' %}" class="user-profile-widget" title="View Profile">
            <div class="user-profile-info">
                <div class="user-avatar-circle">
                    {{ student.name|slice:":1"|upper|default:"S" }}
                </div>
                <div class="user-names-wrap">
                    <div class="user-full-name">{{ student.name|default:"Student" }}</div>
                    <div class="user-role-label">{{ student.department|default:"Student" }}</div>
                </div>
            </div>
        </a>
        <a href="{% url 'student:logout' %}" class="btn-sidebar-logout" title="Sign Out" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; padding: 8px; border-radius: var(--radius-sm); font-size: 0.82rem; color: #ef4444; background: #fef2f2; border: 1px solid #fee2e2; text-decoration: none; font-weight: 600;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Logout</span>
        </a>
    </div>
</aside>

<script>
    (function() {
        const toggleBtn = document.getElementById('assignmentsToggle');
        const group = document.getElementById('assignmentsGroup');
        const submenu = document.getElementById('assignmentsSubmenu');
        if (toggleBtn && group) {
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const isOpen = group.classList.toggle('open');
                if (submenu) {
                    submenu.style.display = isOpen ? 'flex' : 'none';
                }
            });
            toggleBtn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    const isOpen = group.classList.toggle('open');
                    if (submenu) {
                        submenu.style.display = isOpen ? 'flex' : 'none';
                    }
                }
            });
        }
    })();
</script>
